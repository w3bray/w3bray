name: Spotify Now Playing

on:
  # Update frequently so the "now playing" card stays fresh
  schedule:
    - cron: "*/30 * * * *"
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spotify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Spotify card
        uses: Aveek-Saha/Spotify-Now-Playing@v1.0.1
        with:
          # These three come from YOUR Spotify account — set them under
          # Settings -> Secrets and variables -> Actions (see the PR body).
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

      - name: Commit updated card
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add spotify.svg
          if git diff --staged --quiet; then
            echo "No changes to the Spotify card."
          else
            git commit -m "chore: update Spotify now-playing card"
            git push
          fi
