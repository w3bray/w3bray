name: Spotify Now Playing

on:
  # Update frequently so the "now playing" card stays fresh
  schedule:
    - cron: "*/30 * * * *"
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spotify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Spotify card
        env:
          # From YOUR Spotify account, stored in
          # Settings -> Secrets and variables -> Actions
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node .github/scripts/spotify.mjs

      - name: Commit updated card
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add spotify.svg
          if git diff --staged --quiet; then
            echo "No changes to the Spotify card."
          else
            git commit -m "chore: update Spotify now-playing card"
            git push
          fi
