<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" fill="none" role="img" aria-label="w3bray — parasite in the kernel">
  <rect x="1" y="1" width="898" height="208" rx="12" fill="#0d0d0d" stroke="#2a2a2a"/>

  <!-- faint scanlines -->
  <g stroke="#151515" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
  </g>

  <g font-family="'Courier New', Consolas, monospace">
    <!-- prompt -->
    <text x="40" y="52" fill="#5a5a5a" font-size="16">[w3bray@void ~]$ whoami</text>

    <!-- title -->
    <text x="38" y="120" fill="#911515" font-size="62" font-weight="bold" letter-spacing="2">w3bray</text>
    <!-- blinking cursor -->
    <rect x="290" y="82" width="20" height="44" fill="#911515">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>

    <!-- subtitle -->
    <text x="42" y="150" fill="#7a7a7a" font-size="17" font-style="italic">parasite in the kernel</text>

    <!-- rotating taglines -->
    <g font-size="18" fill="#cccccc">
      <text x="42" y="185" opacity="0">&#9656; Advanced Threat Actor | Red Team
        <animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.02;0.18;0.2;1" dur="12.5s" repeatCount="indefinite"/>
      </text>
      <text x="42" y="185" opacity="0">&#9656; Zero-Day Exploitation &amp; Reverse Engineering
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.38;0.4;1" dur="12.5s" repeatCount="indefinite"/>
      </text>
      <text x="42" y="185" opacity="0">&#9656; Parasitic processes and system decay.
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.58;0.6;1" dur="12.5s" repeatCount="indefinite"/>
      </text>
      <text x="42" y="185" opacity="0">&#9656; There is no way out of the sandbox.
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.62;0.78;0.8;1" dur="12.5s" repeatCount="indefinite"/>
      </text>
      <text x="42" y="185" opacity="0">&#9656; We operate where the EDR is blind.
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.82;0.98;1" dur="12.5s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
